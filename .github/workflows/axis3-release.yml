name: AXIS-3 Release

# ساخت و انتشار فایل نصبی لینوکس برای AXIS-3
# اجرا: با پوش کردن تگ axis3-* (مثلاً axis3-v1.0.0) یا دستی از تب Actions
on:
  push:
    tags:
      - "axis3-*"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Linux packages (.deb / .AppImage)
        run: |
          set -o pipefail
          npm run dist:linux 2>&1 | tee build-linux.log

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            desktop-app/dist/*.AppImage
            desktop-app/dist/*.deb
          retention-days: 30

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: out

      - name: Publish to tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="axis3-v1.0.0"; fi
          NOTES="AXIS-3 Robot Control - Linux installers. Ubuntu/Debian: install the .deb (purge the old axis5 release first). Any distro: use the .AppImage."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --title "AXIS-3 Robot Control $TAG (Linux)" --notes "$NOTES"
          fi
