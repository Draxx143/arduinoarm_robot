name: Build Installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installers (.exe)
        run: npm run dist:win

      - name: Build Linux packages (.deb / .AppImage)
        run: npm run dist:linux

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp dist/*.exe dist/*.AppImage dist/*.deb out/ 2>/dev/null || true
          ls -la out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: desktop-app/out/*
          retention-days: 30

      - name: Publish to rolling release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          if gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest * -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create latest * -R "$GITHUB_REPOSITORY" \
              --title "AXIS-5 Robot Control — Installers" \
              --notes "Download the control panel app:

  - **Windows:** \`AXIS5-Robot-Control-Setup-*.exe\` (installer) or \`AXIS5-Robot-Control-Portable-*.exe\` (no install)
  - **Ubuntu/Debian:** \`axis5-robot-control_*.deb\` → \`sudo apt install ./axis5-robot-control_*.deb\`
  - **Any Linux:** \`AXIS5-Robot-Control-*.AppImage\` (chmod +x and run)

  Companion app for the 5-DOF Arduino Mega 2560 robot arm firmware."
          fi

  release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
