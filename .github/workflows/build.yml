name: Build Installers

on:
  push:
    branches:
      - "arena/**"
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installers (.exe)
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath build-win.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report failure log
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $log = "no log file"
          if (Test-Path "build-win.log") { $log = (Get-Content "build-win.log" -Tail 120) -join "`n" }
          Set-Content -Path ci.md -Value $log -Encoding utf8
          gh issue create -R "$env:GITHUB_REPOSITORY" -t "CI win log - run $env:GITHUB_RUN_ID" -F ci.md | Out-Null

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installers
          path: desktop-app/dist/*.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Linux packages (.deb / .AppImage)
        run: |
          set -o pipefail
          npm run dist:linux 2>&1 | tee build-linux.log

      - name: Report failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## CI linux build failure log (tail)"
            echo '```'
            tail -n 120 build-linux.log 2>/dev/null || echo "(no log)"
            echo '```'
          } > ci-comment.md
          gh issue create -R "$GITHUB_REPOSITORY" -t "CI linux log - run $GITHUB_RUN_ID" -F ci-comment.md > /dev/null 2>&1 || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            desktop-app/dist/*.AppImage
            desktop-app/dist/*.deb
          retention-days: 30

  release:
    needs: [build-win, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify builds succeeded
        run: |
          if [ "${{ needs.build-win.result }}" != "success" ] || [ "${{ needs.build-linux.result }}" != "success" ]; then
            echo "A build job did not succeed"; exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: win-installers
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: out

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          NOTES="Installers for the AXIS-5 Robot Control desktop app. Windows: Setup/Portable exe - Ubuntu/Debian: deb - Any Linux: AppImage."
          if gh release view latest -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload latest out/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create latest out/* -R "$GITHUB_REPOSITORY" --title "AXIS-5 Robot Control Installers" --notes "$NOTES"
          fi
