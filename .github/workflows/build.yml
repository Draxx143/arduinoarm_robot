name: Build Installers

on:
  push:
    branches:
      - "arena/**"
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installers
        run: npm run dist:win

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp dist/*.exe dist/*.AppImage dist/*.deb out/ 2>/dev/null || true
          ls -la out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: desktop-app/out/*
          retention-days: 30

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          NOTES="Installers for the AXIS-5 Robot Control desktop app. Windows: Setup/Portable exe - Ubuntu/Debian: deb - Any Linux: AppImage."
          if gh release view latest -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload latest ./* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create latest ./* -R "$GITHUB_REPOSITORY" --title "AXIS-5 Robot Control Installers" --notes "$NOTES"
          fi
