name: Build Installers

on:
  push:
    branches:
      - "arena/**"
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installers
        run: |
          set -o pipefail
          npm run dist:win 2>&1 | tee build-win.log

      - name: Build Linux packages
        run: |
          set -o pipefail
          npm run dist:linux 2>&1 | tee build-linux.log

      - name: Report failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## CI build failure log (tail)"
            echo '```'
            tail -n 120 build-win.log 2>/dev/null || echo "(no win log)"
            echo '```'
            echo '```'
            tail -n 60 build-linux.log 2>/dev/null || echo "(no linux log)"
            echo '```'
          } > ci-comment.md
          gh issue create -R "$GITHUB_REPOSITORY" -t "CI log report - run $GITHUB_RUN_ID" -F ci-comment.md > /dev/null 2>&1 || true

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp dist/*.exe dist/*.AppImage dist/*.deb out/ 2>/dev/null || true
          ls -la out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: desktop-app/out/*
          retention-days: 30

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          NOTES="Installers for the AXIS-5 Robot Control desktop app. Windows: Setup/Portable exe - Ubuntu/Debian: deb - Any Linux: AppImage."
          if gh release view latest -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload latest ./* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create latest ./* -R "$GITHUB_REPOSITORY" --title "AXIS-5 Robot Control Installers" --notes "$NOTES"
          fi
